<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <title>Bullet Journal – Tracker</title>

</head>

<body>
    <div id="login">
        <h2>Log in</h2>
        <input type="email" id="email" placeholder="E-mail">
        <input type="password" id="password" placeholder="Wachtwoord">
        <button id="loginBtn">Log in</button>
        <p id="loginError" style="color:red; display:none;">Login mislukt</p>
    </div>

    <div id="content" style="display:none;">

        <button id="logoutBtn" class="logout-button">Uitloggen</button>

        <nav>
            <a href="../index.html">Cover</a>
            <a href="1_Januari.html">Januari</a>
            <a href="2_Sporten.html">Sporten</a>
            <a href="3_Tracker.html">Tracker</a>

            <a href="6_Dump.html">Dump</a>
            <a href="7_Moment_vd_Dag.html">Moment vd dag</a>
        </nav>

        <h1 class="title">Tracker</h1>

        <div class="tracker-wrapper">
            <svg id="tracker" width="900" height="700"></svg>
            <div class="tracker-blokjes-rij">
                <input class="lijn-tracker" data-key="tracker-woord1" placeholder="Woord">
                <input class="lijn-tracker" data-key="tracker-woord2" placeholder="Woord">
                <input class="lijn-tracker" data-key="tracker-woord3" placeholder="Woord">
                <input class="lijn-tracker" data-key="tracker-woord4" placeholder="Woord">
                <input class="lijn-tracker" data-key="tracker-woord5" placeholder="Woord">
                <input class="lijn-tracker" data-key="tracker-woord6" placeholder="Woord">
            </div>
        </div>

        <div class="legenda-container">

            <!-- Kolom 1 -->
            <div class="legenda-col">
                <div class="legenda-item">
                    <span class="kleur-box" style="background:#ff66cc;"></span> 0-1 Liter
                </div>
                <div class="legenda-item">
                    <span class="kleur-box" style="background:#ff33cc;"></span> 1-1,5 Liter
                </div>
                <div class="legenda-item">
                    <span class="kleur-box" style="background:#cc00cc;"></span> 1,5-2 Liter
                </div>
                <div class="legenda-item">
                    <span class="kleur-box" style="background:#9900cc;"></span> 2-2,5 Liter
                </div>
                <div class="legenda-item">
                    <span class="kleur-box" style="background:#660099;"></span> 2,5+ Liter
                </div>
            </div>

            <!-- Kolom 2 -->
            <div class="legenda-col">
                <div class="legenda-item">
                    <span class="kleur-box" style="background:#0066ff;"></span> 0-1000
                </div>
                <div class="legenda-item">
                    <span class="kleur-box" style="background:#3399ff;"></span> 1000-5000
                </div>
                <div class="legenda-item">
                    <span class="kleur-box" style="background:#66b3ff;"></span> 5000-8000
                </div>
                <div class="legenda-item">
                    <span class="kleur-box" style="background:#a3c2ff;"></span> 8000-10.000
                </div>
                <div class="legenda-item">
                    <span class="kleur-box" style="background:#d9d9d9;"></span> 10.000+
                </div>
            </div>

            <!-- Kolom 3 -->
            <div class="legenda-col">
                <div class="legenda-item">
                    <span class="kleur-box" style="background:#00cc00;"></span> 0-1 uur
                </div>
                <div class="legenda-item">
                    <span class="kleur-box" style="background:#55cc00;"></span> 1-2 uur
                </div>
                <div class="legenda-item">
                    <span class="kleur-box" style="background:#aacc00;"></span> 2-3 uur
                </div>
                <div class="legenda-item">
                    <span class="kleur-box" style="background:#ffcc00;"></span> 3-4 uur
                </div>
                <div class="legenda-item">
                    <span class="kleur-box" style="background:#ff6600;"></span> 4-5 uur
                </div>
                <div class="legenda-item">
                    <span class="kleur-box" style="background:#ff0000;"></span> 5+ uur
                </div>
            </div>
        </div>

        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
        <script src="../JS/Firebase-init.js"></script>
        <script src="../JS/Cover.js"></script>
        <script src="../JS/1_Januari/Tracker.js"></script>
